<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5EFE4">
<title>VIENERO Service</title>
<link rel="apple-touch-icon" href="VIENERO-Speisekarte-Cover.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--papier:#F5EFE4;--karte:#FFFDF8;--tinte:#22211d;--gold:#B08A46;--gold-hell:#C8A76A;
      --linie:rgba(34,33,29,.16);--gedaempft:rgba(34,33,29,.55);--warn:#A85A3C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--papier);color:var(--tinte);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;padding-bottom:110px}
button,input,select,textarea{font-family:inherit;font-size:16px}

/* Anmeldung */
#tor{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px}
#tor img{width:min(260px,68vw);height:auto;display:block}
#tor p{color:var(--gedaempft);font-size:12px;letter-spacing:3px;text-transform:uppercase}
#wer,#wer,#code{width:min(320px,90vw);padding:16px;border-radius:12px;border:1px solid var(--linie);background:var(--karte);color:var(--tinte);text-align:center;letter-spacing:2px}
#wer{letter-spacing:0}
.knopf{padding:15px 30px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);color:#fff;font-weight:600;letter-spacing:1px;cursor:pointer}
.knopf.leer{background:transparent;color:var(--gold)}
#fehler{color:var(--warn);font-size:14px;min-height:20px;text-align:center;line-height:1.5}

/* Kopf */
header{position:sticky;top:0;z-index:20;background:rgba(245,239,228,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--linie);padding:10px 14px calc(12px + env(safe-area-inset-top))}
.marke{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:4px 0 12px}
.marke img{height:19px;width:auto;opacity:.85;justify-self:center}
.werbin{justify-self:start;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gedaempft);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abmelden{justify-self:end;border:1px solid var(--linie);background:transparent;color:var(--gedaempft);
  font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:7px 12px;border-radius:999px;
  cursor:pointer;white-space:nowrap}
@media (max-width:400px){ .marke img{height:16px} .abmelden{padding:6px 9px;font-size:9px} .werbin{font-size:10px} }
.abmelden:hover{border-color:var(--warn);color:var(--warn)}
.navzeile{display:flex;align-items:center;gap:10px}
.pfeil{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--linie);background:var(--karte);color:var(--tinte);font-size:20px;cursor:pointer}
.tag{flex:1;text-align:center}
.tag b{display:block;font-size:17px;font-weight:600}
.tag span{font-size:12px;color:var(--gedaempft)}
.zahlen{display:flex;gap:8px;margin-top:10px}
.kachel{flex:1;background:var(--karte);border:1px solid var(--linie);border-radius:10px;padding:8px;text-align:center}
.kachel b{display:block;font-size:20px}
.kachel span{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gedaempft)}

/* Karten */
main{padding:14px}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:14px;margin-bottom:12px;transition:opacity .25s;box-shadow:0 1px 2px rgba(34,33,29,.05)}
.karte.da{opacity:.5}
.karte.nichtda{opacity:.5;border-color:var(--warn)}
.karte.konflikt{border-color:var(--warn)}
.oben{display:flex;align-items:baseline;gap:12px}
.zeit{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.wer{flex:1;min-width:0}
.wer b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wer span{font-size:13px;color:var(--gedaempft)}
.tisch{flex:none;min-width:52px;height:52px;border-radius:12px;border:1px dashed var(--linie);background:transparent;color:var(--gedaempft);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tisch.gesetzt{border-style:solid;border-color:var(--gold);background:rgba(176,138,70,.12);color:var(--gold)}
.tisch b{font-size:19px;font-weight:600}
.tisch small{font-size:9px;letter-spacing:1px;text-transform:uppercase;opacity:.75}
.marken{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.marke2{font-size:11px;letter-spacing:.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--linie);color:var(--gedaempft)}
.marke2.gold{border-color:var(--gold);color:var(--gold)}
.marke2.warn{border-color:var(--warn);color:var(--warn)}
.text{margin-top:9px;font-size:14px;line-height:1.5;color:rgba(34,33,29,.78)}
.text em{color:var(--gold);font-style:normal}
.reihe{display:flex;gap:8px;margin-top:12px}
.akt{flex:1;padding:13px 8px;border-radius:10px;border:1px solid var(--linie);background:transparent;color:var(--tinte);cursor:pointer;font-size:14px}
.akt.ja{border-color:var(--gold);color:var(--gold)}
.akt.ja.an{background:var(--gold);color:#fff;font-weight:600;border-color:var(--gold)}
.akt.nein.an{background:var(--warn);border-color:var(--warn);color:#fff}
.akt.tel{flex:0 0 54px;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:19px}
.leerhinweis{text-align:center;color:var(--gedaempft);padding:50px 20px;font-size:15px}

/* Plusknopf */
#plus{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:none;background:var(--gold);color:#fff;font-size:32px;line-height:1;cursor:pointer;box-shadow:0 8px 22px rgba(34,33,29,.28);z-index:30}

/* Blatt von unten */
.blatt{position:fixed;inset:0;z-index:40;background:rgba(34,33,29,.42);display:none;align-items:flex-end}
.blatt[data-auf="1"]{display:flex}
.blattinhalt{width:100%;max-height:92dvh;overflow-y:auto;background:var(--papier);border-radius:20px 20px 0 0;border-top:1px solid var(--linie);padding:18px 16px calc(26px + env(safe-area-inset-bottom))}
.griff{width:44px;height:4px;border-radius:2px;background:var(--linie);margin:0 auto 16px}
.blattinhalt h2{font-size:19px;font-weight:600;margin-bottom:14px}
label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gedaempft);margin:14px 0 7px}
input[type=text],input[type=tel],input[type=email],input[type=date],textarea{width:100%;padding:13px;border-radius:10px;border:1px solid var(--linie);background:var(--karte);color:var(--tinte)}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:11px 15px;border-radius:999px;border:1px solid var(--linie);background:var(--karte);color:var(--tinte);cursor:pointer;font-size:14px}
.chip.an{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.gesperrt{opacity:.45;pointer-events:none}
.zaehler{display:flex;align-items:center;gap:14px}
.zaehler button{width:52px;height:52px;border-radius:50%;border:1px solid var(--linie);background:var(--karte);color:var(--tinte);font-size:24px;cursor:pointer}
.zaehler b{font-size:26px;min-width:52px;text-align:center}
.blattreihe{display:flex;gap:10px;margin-top:22px}
.blattreihe .knopf{flex:1;text-align:center}
.hinweiszeile{font-size:12px;color:var(--gedaempft);margin-top:10px;line-height:1.5}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:var(--tinte);border:1px solid var(--tinte);color:var(--papier);padding:12px 20px;border-radius:999px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.an{opacity:1}
</style>
</head>

<div id="app" hidden>
  <header>

<div id="toast"></div>

<script>
(function(){
  var ENDPUNKT = 'https://script.google.com/macros/s/AKfycbx4_5Qh1dGi-EBwv_Fz3uUpVO4S-TRnhfEq2SbcNCjtyJXAkBORKECpc1W3AW6Rqy3H/exec';
  var ZEITEN = ['12:00','12:30','13:00','13:30','14:00','17:00','17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00'];
  var NOTIZ_CHIPS = ['Fensterplatz','Ruhiger Tisch','Allergie','Kinderstuhl','Geburtstag','Hund','Draußen','Stammgast'];
  var WOCHENTAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

  var code = '', adminCode = '', wer = '', istAdmin = false;
  var datum = iso(new Date()), daten = null, ladeNr = 0;

  function iso(d){ var p=function(n){return n<10?'0'+n:''+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function lesbar(s){ return s.substring(8,10)+'.'+s.substring(5,7)+'.'+s.substring(0,4); }
  function wochentag(s){ var d=new Date(+s.substring(0,4), +s.substring(5,7)-1, +s.substring(8,10)); return WOCHENTAGE[d.getDay()]; }
  function verschiebe(tage){ var d=new Date(+datum.substring(0,4), +datum.substring(5,7)-1, +datum.substring(8,10)); d.setDate(d.getDate()+tage); datum=iso(d); laden(); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function melde(text){
    var t=document.getElementById('toast'); t.textContent=text; t.classList.add('an');
    clearTimeout(t._z); t._z=setTimeout(function(){ t.classList.remove('an'); },2200);
  }

  function schicke(nutzlast){
    nutzlast.code = code;
    nutzlast.wer = wer;
    if (adminCode) nutzlast.adminCode = adminCode;
    return fetch(ENDPUNKT, {
      method:'POST', mode:'cors', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(nutzlast)
    }).then(function(a){ return a.json(); });
  }

  /* ---------- Anmeldung ---------- */
  var gespeichert = null;
  try {
    gespeichert = localStorage.getItem('vienero-service');
    wer = localStorage.getItem('vienero-wer') || '';
    adminCode = localStorage.getItem('vienero-admin') || '';
  } catch(e) {}

  document.getElementById('rein').addEventListener('click', anmelden);
  document.getElementById('code').addEventListener('keydown', function(e){ if(e.key==='Enter') anmelden(); });
  document.getElementById('wer').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('code').focus(); });

  function anmelden(){
    var eingabe = document.getElementById('code').value.trim();
    var name = document.getElementById('wer').value.trim();
    if(!eingabe) return;
    if(!name){ document.getElementById('fehler').textContent = 'Bitte einen Namen eintragen.'; return; }
    wer = name;
    pruefe(eingabe);
  }

  function pruefe(eingabe){
    document.getElementById('fehler').textContent = 'Moment…';
    code = eingabe;
    schicke({typ:'liste', datum:datum}).then(function(a){
      if(!a.ok){
        code='';
        document.getElementById('fehler').innerHTML = (a.code === false)
          ? 'Code stimmt nicht.'
          : 'Das Skript ist noch nicht neu bereitgestellt.<br>Apps Script, Bereitstellen, Bereitstellungen verwalten, Stift, Neue Version.';
        return;
      }
      try {
        localStorage.setItem('vienero-service', eingabe);
        localStorage.setItem('vienero-wer', wer);
      } catch(e) {}
      istAdmin = !!a.admin;
      document.getElementById('werbin').textContent = wer;
      document.getElementById('fehler').textContent = '';
      document.getElementById('tor').hidden = true;
      document.getElementById('app').hidden = false;
      document.getElementById('plus').hidden = false;
      zeichne(a);
      setInterval(function(){ if(!document.hidden) laden(true); }, 60000);
      document.addEventListener('visibilitychange', function(){ if(!document.hidden) laden(true); });
    }).catch(function(){
      code=''; document.getElementById('fehler').textContent='Keine Verbindung.';
    });
  }
  if(gespeichert && wer){ pruefe(gespeichert); }
  else if(wer){ document.getElementById('wer').value = wer; }

  /* ---------- Laden und Zeichnen ---------- */
  function laden(leise){
    var meine = ++ladeNr;
    var zielDatum = datum;
    if(!leise){
      document.getElementById('tagName').textContent = wochentag(zielDatum) + ', ' + lesbar(zielDatum);
      document.getElementById('tagZusatz').textContent = 'Lädt…';
      document.getElementById('liste').innerHTML = '<div class="leerhinweis">Lädt…</div>';
    }
    schicke({typ:'liste', datum:zielDatum}).then(function(a){
      if(meine !== ladeNr) return;   // eine neuere Anfrage hat Vorrang
      if(a.ok) zeichne(a);
    }).catch(function(){
      if(meine !== ladeNr) return;
      if(!leise) melde('Keine Verbindung');
    });
  }

  function zeichne(a){
    daten = a;
    istAdmin = !!a.admin;
    var heute = a.datum === a.heute;
    document.getElementById('tagName').textContent = wochentag(a.datum) + ', ' + lesbar(a.datum);
    document.getElementById('tagZusatz').textContent = heute ? 'Heute' : '';
    var da = 0, offen = 0;
    a.liste.forEach(function(z){ if(z.erschienen==='ja') da++; if(z.status==='offen') offen++; });
    document.getElementById('zGaeste').textContent = a.gaeste;
    document.getElementById('zTische').textContent = a.tische;
    document.getElementById('zDa').textContent = da;
    document.getElementById('zOffen').textContent = offen;

    var m = document.getElementById('liste');
    if(!a.liste.length){ m.innerHTML = '<div class="leerhinweis">Für diesen Tag liegt nichts vor.</div>'; return; }

    m.innerHTML = a.liste.map(function(z){
      var marken = '';
      if(z.status==='offen') marken += '<span class="marke2 warn">noch offen</span>';
      if(z.konflikt) marken += '<span class="marke2 warn">Tisch doppelt belegt</span>';
      if(z.gast && z.gast!=='Neu') marken += '<span class="marke2 gold">'+esc(z.gast)+(z.zuletzt?' · '+esc(z.zuletzt):'')+'</span>';
      else marken += '<span class="marke2">Neu</span>';
      if(z.quelle && z.quelle!=='Website') marken += '<span class="marke2">'+esc(z.quelle)+'</span>';

      var text = '';
      if(z.anmerkung && z.anmerkung!=='keine Angabe') text += esc(z.anmerkung);
      if(z.notiz) text += (text?'<br>':'') + '<em>'+esc(z.notiz)+'</em>';

      return '<div class="karte '+(z.erschienen==='ja'?'da':(z.erschienen==='nein'?'nichtda':''))+(z.konflikt?' konflikt':'')+'" data-k="'+esc(z.k)+'">'
        + '<div class="oben"><div class="zeit">'+esc(z.zeit)+'</div>'
        + '<div class="wer"><b>'+esc(z.vorname)+' '+esc(z.nachname)+'</b><span>'+esc(z.personen)+'</span></div>'
        + '<button class="tisch'+(z.tisch?' gesetzt':'')+'" data-tu="tisch">'
        +   (z.tisch ? '<b>'+esc(z.tisch)+'</b><small>Tisch</small>' : '<small>Tisch</small><b>+</b>')
        + '</button></div>'
        + '<div class="marken">'+marken+'</div>'
        + (text?'<div class="text">'+text+'</div>':'')
        + '<div class="reihe">'
        +   '<button class="akt ja'+(z.erschienen==='ja'?' an':'')+'" data-tu="ja">Da</button>'
        +   '<button class="akt nein'+(z.erschienen==='nein'?' an':'')+'" data-tu="nein">Nicht da</button>'
        +   '<button class="akt" data-tu="aendern">Ändern</button>'
        +   (z.telefon?'<a class="akt tel" href="tel:'+esc(z.telefon.replace(/[^0-9+]/g,''))+'">&#9742;</a>':'')
        + '</div></div>';
    }).join('');
  }

  document.getElementById('liste').addEventListener('click', function(e){
    var knopf = e.target.closest('[data-tu]'); if(!knopf) return;
    var karte = knopf.closest('.karte'); var k = karte.getAttribute('data-k');
    var was = knopf.getAttribute('data-tu');
    var satz = daten.liste.filter(function(z){ return z.k===k; })[0];

    if(was==='aendern'){ aendernBlatt(satz); return; }
    if(was==='tisch'){ tischBlatt(satz); return; }

    var neu = (satz.erschienen===was) ? '' : was;
    satz.erschienen = neu;
    karte.className = 'karte' + (neu==='ja'?' da':(neu==='nein'?' nichtda':''));
    karte.querySelector('[data-tu="ja"]').classList.toggle('an', neu==='ja');
    karte.querySelector('[data-tu="nein"]').classList.toggle('an', neu==='nein');
    var da=0; daten.liste.forEach(function(z){ if(z.erschienen==='ja') da++; });
    document.getElementById('zDa').textContent = da;
    schicke({typ:'da', k:k, erschienen:neu}).catch(function(){ melde('Nicht gespeichert'); });
  });

  document.getElementById('abmelden').addEventListener('click', function(){
    if(!confirm('Von diesem Gerät abmelden? Beim nächsten Öffnen wird wieder der Code gebraucht.')) return;
    try {
      localStorage.removeItem('vienero-service');
      localStorage.removeItem('vienero-wer');
      localStorage.removeItem('vienero-admin');
    } catch(e) {}
    location.reload();
  });

  document.getElementById('zurueck').addEventListener('click', function(){ verschiebe(-1); });
  document.getElementById('vor').addEventListener('click', function(){ verschiebe(1); });

  /* ---------- Blatt von unten ---------- */
  var blatt = document.getElementById('blatt');
  var koerper = document.getElementById('blattKoerper');
  blatt.addEventListener('click', function(e){ if(e.target===blatt) zu(); });
  function auf(){ blatt.setAttribute('data-auf','1'); }
  function zu(){ blatt.setAttribute('data-auf','0'); koerper.innerHTML=''; }

  function chipReihe(werte, gewaehlt){
    return '<div class="chips">' + werte.map(function(w){
      return '<button type="button" class="chip'+(gewaehlt===w?' an':'')+'" data-wert="'+esc(w)+'">'+esc(w)+'</button>';
    }).join('') + '</div>';
  }

  function aendernBlatt(satz){
    var tische = (daten && daten.tischliste) ? daten.tischliste : [];
    var gesperrt = !istAdmin;
    koerper.innerHTML =
      '<h2>' + esc(satz.vorname) + ' ' + esc(satz.nachname) + ' ändern</h2>'
      + '<label>Datum' + (gesperrt ? ' · nur Leitung' : '') + '</label>'
      + '<input type="date" id="aDatum" value="' + esc(satz.datum || daten.datum) + '"' + (gesperrt?' disabled':'') + '>'
      + '<label>Uhrzeit' + (gesperrt ? ' · nur Leitung' : '') + '</label>'
      + '<div id="aZeiten"' + (gesperrt?' class="gesperrt"':'') + '>' + chipReihe(ZEITEN, satz.zeit) + '</div>'
      + '<label>Personen</label><div class="zaehler"><button type="button" id="aMinus">−</button>'
      +   '<b id="aZahl">' + (parseInt(satz.personen,10)||2) + '</b><button type="button" id="aPlus">+</button></div>'
      + '<label>Vorname</label><input type="text" id="aVorname" value="' + esc(satz.vorname) + '">'
      + '<label>Nachname</label><input type="text" id="aNachname" value="' + esc(satz.nachname) + '">'
      + '<label>Telefon</label><input type="tel" id="aTelefon" inputmode="tel" value="' + esc(satz.telefon) + '">'
      + '<label>E-Mail</label><input type="email" id="aMail" inputmode="email" value="' + esc(satz.email || '') + '">'
      + '<label>Anmerkung des Gastes</label><textarea id="aAnmerkung">' + esc(satz.anmerkung === 'keine Angabe' ? '' : satz.anmerkung) + '</textarea>'
      + '<label>Tisch</label><div id="aTische">' + chipReihe(tische, satz.tisch) + '</div>'
      + '<label>Notiz für den Service</label><div id="aNotizChips">' + chipReihe(NOTIZ_CHIPS, null) + '</div>'
      + '<textarea id="aNotiz" style="margin-top:8px">' + esc(satz.notiz) + '</textarea>'
      + '<label style="display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--tinte)">'
      +   '<input type="checkbox" id="aMelden" style="width:22px;height:22px" ' + (satz.email ? 'checked' : 'disabled') + '>'
      +   'Gast per Mail über die Änderung informieren</label>'
      + (satz.email ? '' : '<div class="hinweiszeile">Für diesen Gast ist keine Mailadresse hinterlegt.</div>')
      + (gesperrt ? '<div class="hinweiszeile">Datum und Uhrzeit lassen sich nur mit dem Leitungs-Code ändern.</div>'
                    + '<button class="knopf leer" id="aFrei" style="margin-top:10px;width:100%">Mit Leitungs-Code freischalten</button>' : '')
      + '<div class="blattreihe"><button class="knopf leer" id="aAbbruch">Abbrechen</button>'
      + '<button class="knopf" id="aSpeichern">Speichern</button></div>';
    auf();

    var personen = parseInt(satz.personen,10)||2;
    var zeit = satz.zeit, tisch = satz.tisch || '';

    if(!gesperrt){
      koerper.querySelector('#aZeiten').addEventListener('click', function(e){
        var c=e.target.closest('.chip'); if(!c) return;
        koerper.querySelectorAll('#aZeiten .chip').forEach(function(x){x.classList.remove('an');});
        c.classList.add('an'); zeit=c.getAttribute('data-wert');
      });
    }
    koerper.querySelector('#aTische').addEventListener('click', function(e){
      var c=e.target.closest('.chip'); if(!c) return;
      var w=c.getAttribute('data-wert'); if(tisch===w) w='';
      tisch=w;
      koerper.querySelectorAll('#aTische .chip').forEach(function(x){
        x.classList.toggle('an', x.getAttribute('data-wert')===w);});
    });
    koerper.querySelector('#aNotizChips').addEventListener('click', function(e){
      var c=e.target.closest('.chip'); if(!c) return;
      var f=document.getElementById('aNotiz'), w=c.getAttribute('data-wert');
      f.value = f.value ? (f.value.indexOf(w)===-1 ? f.value+', '+w : f.value) : w;
    });
    document.getElementById('aMinus').addEventListener('click', function(){
      if(personen>1){personen--; document.getElementById('aZahl').textContent=personen;}});
    document.getElementById('aPlus').addEventListener('click', function(){
      if(personen<40){personen++; document.getElementById('aZahl').textContent=personen;}});
    document.getElementById('aAbbruch').addEventListener('click', zu);
    var freiKnopf = document.getElementById('aFrei');
    if(freiKnopf){ freiKnopf.addEventListener('click', function(){
      leitungBlatt(function(){ aendernBlatt(satz); });
    }); }

    document.getElementById('aSpeichern').addEventListener('click', function(){
      this.disabled = true; this.textContent = 'Speichert…';
      var nutzlast = {
        typ:'aendern', k:satz.k,
        personen: personen + (personen===1?' Person':' Personen'),
        vorname: document.getElementById('aVorname').value.trim(),
        nachname: document.getElementById('aNachname').value.trim(),
        telefon: document.getElementById('aTelefon').value.trim(),
        email: document.getElementById('aMail').value.trim(),
        anmerkungen: document.getElementById('aAnmerkung').value.trim(),
        notiz: document.getElementById('aNotiz').value.trim(),
        tisch: tisch,
        melden: document.getElementById('aMelden').checked
      };
      if(!gesperrt){
        nutzlast.datum = document.getElementById('aDatum').value;
        nutzlast.uhrzeit = zeit;
      }
      schicke(nutzlast).then(function(a){
        zu();
        if(a.ok && a.nichts){ melde('Nichts geändert'); }
        else if(a.ok){ melde(a.benachrichtigt ? 'Geändert, Gast informiert' : 'Geändert'); laden(true); }
        else if(a.adminNoetig){ melde('Datum und Uhrzeit nur mit Leitungs-Code'); }
        else { melde('Nicht gespeichert'); }
      }).catch(function(){ zu(); melde('Keine Verbindung'); });
    });
  }

  function tischBlatt(satz){
    var tische = (daten && daten.tischliste) ? daten.tischliste : [];
    koerper.innerHTML =
      '<h2>Tisch für '+esc(satz.vorname)+' '+esc(satz.nachname)+'</h2>'
      + '<div class="hinweiszeile">'+esc(satz.zeit)+' Uhr · '+esc(satz.personen)+'</div>'
      + '<label>Tisch antippen</label>' + chipReihe(tische, satz.tisch)
      + '<div class="blattreihe"><button class="knopf leer" id="tFrei">Kein Tisch</button>'
      + '<button class="knopf" id="tZu">Fertig</button></div>';
    auf();
    koerper.querySelector('.chips').addEventListener('click', function(e){
      var c = e.target.closest('.chip'); if(!c) return;
      var wert = c.getAttribute('data-wert');
      if (satz.tisch === wert) { wert = ''; }
      setzeTisch(satz, wert);
      koerper.querySelectorAll('.chip').forEach(function(x){
        x.classList.toggle('an', x.getAttribute('data-wert') === wert);
      });
    });
    document.getElementById('tFrei').addEventListener('click', function(){ setzeTisch(satz, ''); zu(); });
    document.getElementById('tZu').addEventListener('click', zu);
  }

  function setzeTisch(satz, wert){
    satz.tisch = wert;
    zeichne(daten);
    schicke({typ:'da', k:satz.k, tisch:wert}).catch(function(){ melde('Nicht gespeichert'); });
  }

  document.getElementById('plus').addEventListener('click', function(){
    if(!istAdmin){ leitungBlatt(null); return; }
    koerper.innerHTML =
      '<h2>Eintragen</h2>'
      + '<div class="blattreihe"><button class="knopf" id="wTelefon">Telefonreservierung</button>'
      + '<button class="knopf leer" id="wWalk">Walk-in</button></div>'
      + '<div class="hinweiszeile">Walk-in wird sofort als anwesend gezählt und braucht nur die Personenzahl.</div>';
    auf();
    document.getElementById('wTelefon').addEventListener('click', function(){ neuBlatt(false); });
    document.getElementById('wWalk').addEventListener('click', function(){ neuBlatt(true); });
  });

  function leitungBlatt(danach){
    koerper.innerHTML =
      '<h2>Reservierung eintragen</h2>'
      + '<div class="hinweiszeile">Dafür braucht es den Leitungs-Code. Beim Eintragen gehen Bestätigungen '
      + 'im Namen des Lokals raus, deshalb ist das nicht für alle offen.</div>'
      + '<label>Leitungs-Code</label><input type="password" id="lCode" autocomplete="off">'
      + '<div id="lFehler" style="color:var(--warn);font-size:13px;margin-top:8px;min-height:18px"></div>'
      + '<div class="blattreihe"><button class="knopf leer" id="lAbbruch">Abbrechen</button>'
      + '<button class="knopf" id="lOk">Freischalten</button></div>';
    auf();
    document.getElementById('lAbbruch').addEventListener('click', zu);
    document.getElementById('lCode').addEventListener('keydown', function(e){ if(e.key==='Enter') pruefeLeitung(danach); });
    document.getElementById('lOk').addEventListener('click', function(){ pruefeLeitung(danach); });
  }

  function pruefeLeitung(danach){
    var eingabe = document.getElementById('lCode').value.trim();
    if(!eingabe) return;
    document.getElementById('lFehler').textContent = 'Moment…';
    var vorher = adminCode;
    adminCode = eingabe;
    schicke({typ:'liste', datum:datum}).then(function(a){
      if(a.ok && a.admin){
        try { localStorage.setItem('vienero-admin', eingabe); } catch(e) {}
        istAdmin = true; zu(); melde('Freigeschaltet');
        if(typeof danach === 'function'){ danach(); }
        else { document.getElementById('plus').click(); }
      } else {
        adminCode = vorher;
        document.getElementById('lFehler').textContent = 'Code stimmt nicht.';
      }
    }).catch(function(){
      adminCode = vorher;
      document.getElementById('lFehler').textContent = 'Keine Verbindung.';
    });
  }

  function neuBlatt(walkIn){
    var jetzt = new Date();
    var std = (jetzt.getHours()<10?'0':'')+jetzt.getHours();
    var minute = jetzt.getMinutes()<30 ? '00' : '30';
    var startZeit = walkIn ? (std+':'+minute) : '19:00';
    var personen = 2;

    koerper.innerHTML =
      '<h2>'+(walkIn?'Walk-in':'Telefonreservierung')+'</h2>'
      + (walkIn?'':'<label>Datum</label><input type="date" id="fDatum" value="'+datum+'">')
      + '<label>Uhrzeit</label><div id="fZeiten">'+chipReihe(ZEITEN, startZeit)+'</div>'
      + '<label>Personen</label><div class="zaehler"><button type="button" id="fMinus">−</button><b id="fZahl">2</b><button type="button" id="fPlus">+</button></div>'
      + '<label>Name</label><input type="text" id="fName" autocomplete="off" placeholder="'+(walkIn?'optional':'Nachname')+'">'
      + (walkIn?'':'<label>Telefon</label><input type="tel" id="fTel" inputmode="tel" placeholder="+43 664 1234567">'
      + '<label>E-Mail, optional</label><input type="email" id="fMail" inputmode="email" placeholder="für die Bestätigung">')
      + '<label>Tisch, optional</label><div id="fTische">' + chipReihe((daten && daten.tischliste) ? daten.tischliste : [], null) + '</div>'
      + '<label>Notiz</label>' + chipReihe(NOTIZ_CHIPS, null)
      + '<textarea id="fNotiz" style="margin-top:8px"></textarea>'
      + '<div class="hinweiszeile">'+(walkIn?'Wird als zugesagt und anwesend gespeichert.':'Wird sofort als zugesagt gespeichert. Mit E-Mail bekommt der Gast eine Bestätigung samt Kalendereintrag.')+'</div>'
      + '<div class="blattreihe"><button class="knopf leer" id="fAbbruch">Abbrechen</button>'
      + '<button class="knopf" id="fSpeichern">Speichern</button></div>';
    auf();

    var gewaehlteZeit = startZeit;
    var gewaehlterTisch = '';
    koerper.querySelector('#fTische').addEventListener('click', function(e){
      var c = e.target.closest('.chip'); if(!c) return;
      var wert = c.getAttribute('data-wert');
      if (gewaehlterTisch === wert) { wert = ''; }
      gewaehlterTisch = wert;
      koerper.querySelectorAll('#fTische .chip').forEach(function(x){
        x.classList.toggle('an', x.getAttribute('data-wert') === wert);
      });
    });
    koerper.querySelector('#fZeiten').addEventListener('click', function(e){
      var c = e.target.closest('.chip'); if(!c) return;
      koerper.querySelectorAll('#fZeiten .chip').forEach(function(x){ x.classList.remove('an'); });
      c.classList.add('an'); gewaehlteZeit = c.getAttribute('data-wert');
    });
    koerper.querySelectorAll('.chips')[2].addEventListener('click', function(e){
      var c = e.target.closest('.chip'); if(!c) return;
      var f = document.getElementById('fNotiz'); var w = c.getAttribute('data-wert');
      c.classList.toggle('an');
      f.value = f.value ? (f.value.indexOf(w)===-1 ? f.value+', '+w : f.value.replace(new RegExp(',?\\s*'+w),'')) : w;
      f.value = f.value.replace(/^,\s*/,'');
    });
    document.getElementById('fMinus').addEventListener('click', function(){ if(personen>1){personen--; document.getElementById('fZahl').textContent=personen;} });
    document.getElementById('fPlus').addEventListener('click', function(){ if(personen<30){personen++; document.getElementById('fZahl').textContent=personen;} });
    document.getElementById('fAbbruch').addEventListener('click', zu);

    document.getElementById('fSpeichern').addEventListener('click', function(){
      var name = (document.getElementById('fName').value||'').trim();
      var teile = name.split(' ');
      var nachname = teile.length>1 ? teile.slice(1).join(' ') : name;
      var vorname = teile.length>1 ? teile[0] : (walkIn && !name ? 'Walk-in' : '');
      var nutzlast = {
        typ:'neu',
        quelle: walkIn ? 'Walk-in' : 'Telefon',
        datum: walkIn ? datum : (document.getElementById('fDatum').value || datum),
        uhrzeit: gewaehlteZeit,
        personen: personen + (personen===1?' Person':' Personen'),
        vorname: vorname, nachname: nachname,
        telefon: walkIn ? '' : (document.getElementById('fTel').value||'').trim(),
        email: walkIn ? '' : (document.getElementById('fMail').value||'').trim(),
        tisch: gewaehlterTisch,
        notiz: (document.getElementById('fNotiz').value||'').trim(),
        anmerkungen: ''
      };
      this.disabled = true; this.textContent = 'Speichert…';
      schicke(nutzlast).then(function(a){
        zu();
        if(a.ok){ melde('Eingetragen'); laden(true); }
        else if(a.adminNoetig){ istAdmin = false; melde('Dafür fehlt der Leitungs-Code'); }
        else { melde('Nicht gespeichert'); }
      }).catch(function(){ zu(); melde('Keine Verbindung'); });
    });
  }
})();
</script>
</body>
</html>
