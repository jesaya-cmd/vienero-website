<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bewerten Sie uns · VIENERO</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter:wght@400;500&display=swap');
  :root{--ivory:#F8F5EE;--gold:#C8A76A;--anthrazit:#2F3133;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--anthrazit);color:var(--ivory);font-family:'Inter',sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
  .k{max-width:460px}
  .augenbraue{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
  h1{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(30px,7vw,46px);margin:16px 0 14px}
  p{font-size:14px;line-height:1.8;color:rgba(248,245,238,.62);margin-bottom:30px}
  .knoepfe{display:flex;flex-direction:column;gap:12px;align-items:center}
  .btn{display:inline-block;min-width:260px;padding:14px 30px;border:1px solid var(--gold);background:var(--gold);color:var(--anthrazit);
    text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;border-radius:999px}
  .btn.zwei{background:transparent;color:var(--ivory)}
  .btn:focus-visible{outline:2px solid var(--ivory);outline-offset:3px}
  .fuss{margin-top:34px;font-size:11px;color:rgba(248,245,238,.4);line-height:1.8}
</style>
</head>
<body>
  <div class="k">
    <p class="augenbraue">Danke für Ihren Besuch</p>
    <h1>Wie hat es Ihnen geschmeckt?</h1>
    <p>Wir freuen uns sehr über ein paar Worte von Ihnen.<br>
       Enjoyed your meal? We would love to hear about your visit.</p>
    <div class="knoepfe">
      <a class="btn" href="https://search.google.com/local/writereview?placeid=ChIJgW_yxhwHbUcR41jU9NKZ9OQ">Auf Google bewerten</a>
      <a class="btn zwei" href="https://www.tripadvisor.com/UserReviewEdit-g190454-d34758370-Vienero-Vienna_Austria.html">Review us on Tripadvisor</a>
    </div>
    <p class="fuss">VIENERO &middot; Der mediterrane Wiener<br>Dr.-Karl-Lueger-Platz 3, 1010 Wien</p>
  </div>
</body>
</html>
