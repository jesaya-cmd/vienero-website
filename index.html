<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIENERO — Der mediterrane Wiener. Eröffnung 5. September.</title>
<meta name="robots" content="noindex, nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500;600&display=swap');
  :root{
    --ivory:#F8F5EE; --sage:#AEB2A0; --gold:#C8A76A; --anthrazit:#2F3133;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;font-family:'Inter',sans-serif;background:var(--anthrazit);overflow:hidden;}
  .stage{position:relative;height:100vh;width:100vw;overflow:hidden;}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(47,49,51,0.15) 0%,rgba(47,49,51,0.55) 55%,rgba(47,49,51,0.85) 100%);}
  .content{position:absolute;left:0;right:0;bottom:0;padding:6vh 6vw;text-align:center;color:var(--ivory);}
  .eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:rgba(248,245,238,0.75);margin-bottom:14px;}
  .wordmark{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(40px,9vw,90px);letter-spacing:2px;line-height:1;margin-bottom:10px;}
  .tag{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(15px,2vw,20px);color:var(--gold);margin-bottom:28px;}
  .countdown{display:flex;justify-content:center;gap:clamp(14px,4vw,40px);margin-bottom:30px;flex-wrap:wrap;}
  .cd-item{min-width:64px;}
  .cd-num{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(26px,5vw,44px);line-height:1;}
  .cd-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(248,245,238,0.65);margin-top:6px;}
  .btn{display:inline-block;padding:14px 36px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;border-radius:999px;transition:background .3s ease,color .3s ease;}
  .btn:hover{background:var(--gold);color:var(--anthrazit);}
  .social{margin-top:22px;}
  .social a{color:rgba(248,245,238,0.7);font-size:12px;letter-spacing:1px;text-decoration:none;}
  .social a:hover{color:var(--gold);}
  @media (max-width:600px){ .content{padding:5vh 6vw;} }
</style>
</head>

      <div class="cd-item"><div class="cd-num" id="cd-days">--</div><div class="cd-label">Tage</div></div>
      <div class="cd-item"><div class="cd-num" id="cd-hours">--</div><div class="cd-label">Std</div></div>
      <div class="cd-item"><div class="cd-num" id="cd-mins">--</div><div class="cd-label">Min</div></div>
      <div class="cd-item"><div class="cd-num" id="cd-secs">--</div><div class="cd-label">Sek</div></div>
    </div>
    <a class="btn" href="https://www.thefork.at/restaurant/vienero" target="_blank" rel="noopener">Tisch reservieren</a>
    <div class="social"><a href="https://www.instagram.com/vienero.restaurant" target="_blank" rel="noopener">Instagram</a></div>
  </div>
</div>
<script>
  const target = new Date('2026-09-05T13:00:00+02:00').getTime();
  function tick(){
    const now = new Date().getTime();
    const diff = target - now;
    if(diff <= 0){
      document.getElementById('countdown').innerHTML = '<div class="cd-item"><div class="cd-num">Jetzt</div><div class="cd-label">geöffnet</div></div>';
      return;
    }
    const d = Math.floor(diff/(1000*60*60*24));
    const h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    const m = Math.floor((diff%(1000*60*60))/(1000*60));
    const s = Math.floor((diff%(1000*60))/1000);
    document.getElementById('cd-days').textContent = d;
    document.getElementById('cd-hours').textContent = String(h).padStart(2,'0');
    document.getElementById('cd-mins').textContent = String(m).padStart(2,'0');
    document.getElementById('cd-secs').textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
